name: Studio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/long-form-narration", "feat/safe-media-recovery", "feat/idea-to-cartoon-assistant"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hd_export:
    name: Decode 1080p and picture cutout videos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Encode, download and independently decode short videos
        run: npx playwright test --project=media-export --grep '1080p WebM|joins two genuine 1080p|local 2D cartoon finish|plain background cleanup|mirrored uploaded arm artwork|nested picture forearm and shin|reparented painted hand follows'
      - name: Keep both videos and decoded frames
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: short-media-proof
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Foundation and browser QA
    runs-on: ubuntu-latest
    # Ubuntu mirror downloads can exceed 40 minutes during Playwright's
    # WebKit/Firefox system-dependency setup. Retain ALL browser coverage;
    # allow installation and actual desktop/phone/tablet QA to finish.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Types, lint, unit tests, and production build
        run: npm run check
      - name: Install Chromium, Firefox and WebKit for browser tests
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Desktop, phone, tablet and cross-browser creator workflows
        run: npm run test:e2e
      - name: Keep browser QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-qa-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package verified Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  episode:
    name: Complete 20-minute episode and genuine exports
    # Pin the real-time browser encoder to a stable host image.
    # ubuntu-latest can change OS, compositor and codec versions between runs;
    # transient >500ms scheduling stalls failed full proof on #128 attempts 1/2.
    # Retain all 10 two-minute genuine WebM exports and independent decoding.
    runs-on: ubuntu-24.04
    # Browser/codec installs sometimes take >20 minutes on hosted Ubuntu mirrors.
    # Keep the genuine ten-part 20-minute movie export and independent decoding;
    # allow setup time without cancelling while the final part is rendering.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exclude blocked third-party package feed on the media runner
        run: |
          # Playwright dependencies and FFmpeg come from Ubuntu. A preinstalled
          # Microsoft apt feed returned 403 before any episode test could run.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "${source}.chiptoons-disabled"
            fi
          done
      - name: Install verified browser and offline media tools
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check binary-media compatibility before the real-time proof
        run: npx playwright test --project=webkit --grep 'file-backed originals'
      - name: Restore, reopen, export and decode a complete narrated episode
        run: npm run test:episode
      - name: Keep every genuine part and independent decoding measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: complete-episode-qa-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [verify, episode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
