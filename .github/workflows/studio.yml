name: Studio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/long-form-narration", "feat/safe-media-recovery", "feat/idea-to-cartoon-assistant"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Types, lint, unit tests, and production build
        run: npm run check
      - name: Install Chromium, Firefox and WebKit for browser tests
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Desktop, phone, tablet and cross-browser creator workflows
        run: npm run test:e2e
      - name: Keep browser QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-qa-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package verified Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  episode:
    name: Complete 20-minute episode and genuine exports
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install verified browser and offline media tools
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check binary-media compatibility before the real-time proof
        run: npx playwright test --project=webkit --grep 'file-backed originals'
      - name: Restore, reopen, export and decode a complete narrated episode
        run: npm run test:episode
      - name: Keep every genuine part and independent decoding measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: complete-episode-qa-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [verify, episode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
