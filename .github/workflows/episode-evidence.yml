name: Retain episode verification evidence
on:
  push:
    branches: ["feat/long-form-narration"]
    paths:
      - ".github/workflows/episode-evidence.yml"
      - ".github/scripts/episode-evidence.mjs"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Studio checks run containing both QA artifacts"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    name: Extract recorded screenshots, measurements and viewing excerpts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - name: Extract evidence from the successful production proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.run_id || '41577239374' }}
        run: node .github/scripts/episode-evidence.mjs
      - name: Keep reviewable evidence files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: retained-episode-evidence
          path: .evidence/output/
          retention-days: 14
